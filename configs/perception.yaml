# Perception config. `detector` selects the single active head-camera detector
# (factory `_DETECTORS` map): `apriltag` (live ZMQ + AprilTag) or `ground_truth`
# (constant sim block pose, no camera/marker). A model-based detector registers
# in the same map later.
detector: apriltag

# AprilTag block detection (params for the `apriltag` detector).
tag:
  family: "tag36h11"
  size_m: 0.0481           # tag black-square edge (m) = 0.801 (black fraction of
                           # apriltag_14.png) x 0.06 (cube top face). Geometric/true
                           # value; GT depth cross-check agreed to ~5%. On hardware,
                           # measure the printed tag's black-square edge.
  # Rigid offset from the AprilTag frame to the block BODY frame, in the tag frame.
  # The tag is on the +Z (top) face of the 6 cm cube: the block center is 0.03 m
  # below the tag along -z_tag (xyz), and rpy=[pi,0,0] flips the tag's optical frame
  # (z into the surface) onto the block body frame (z up) -- the measured tag->body
  # rotation was 178.7 deg about x. detect() then returns an upright block pose.
  tag_to_block:
    xyz: [0.0, 0.0, -0.03]
    rpy: [3.141593, 0.0, 0.0]
  # Map of tag id -> semantic name (optional). Unlisted ids are ignored.
  # The sim red-block USD carries AprilTag ID 14 (family 36h11).
  ids:
    14: "block"

filter:
  median_frames: 5         # median over N frames before a pose is accepted.
  max_stale_s: 0.5         # reject poses older than this.
  min_decision_margin: 30.0  # pupil-apriltags decision_margin gate.

# pupil_apriltags detector params. quad_decimate=1.0 (no downsampling) is REQUIRED
# here: the sim tag is small (~30 px) in the 640x480 head frame, and the library
# default of 2.0 downsamples it below the decode threshold (tag goes undetected).
detector_params:
  quad_decimate: 1.0
  nthreads: 4

# Ground-truth detector (sim, marker-free). The block's WORLD-frame pose in the
# Isaac scene; transforms.Frames maps it to the pelvis frame via robot.yaml
# `sim.base_world_pose`. Matches the dex3 red-block scene init pose (later: swap
# for a live rt/sim_state read). Used only when `detector: ground_truth`.
ground_truth:
  block:
    xyz: [-4.25, -4.03, 0.84]
    quat_wxyz: [1.0, 0.0, 0.0, 0.0]
