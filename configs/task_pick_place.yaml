# Pick-and-place task parameters. All poses in the pelvis frame (meters/radians).
home_q14_deg: [15, 10, 0, 30, 0, 0, 0,   15, -10, 0, 30, 0, 0, 0]  # L7 then R7

# Table plane in the pelvis frame. Calibrate empirically (script 05) -- do NOT
# assume z-up == table-up; the back-plate mount may tilt the pelvis.
table:
  height_z: 0.05           # USER-PROVIDED / calibrated table-top height (m).
  normal: [0.0, 0.0, 1.0]  # pelvis-frame table normal (calibrated).

# Workspace box (pelvis frame) -- Cartesian goals outside are rejected pre-plan.
# z spans below the pelvis: the suspended pelvis sits above the table, so EE z is
# often negative. Calibrate to the real table volume on hardware.
workspace_box:
  min: [0.05, -0.45, -0.20]
  max: [0.65,  0.45,  0.60]

grasp:
  # approach: top_down (palm faces -z; near-singular in some workspaces) |
  #           home_aligned (palm oriented like the arm's home EE pose -- well-
  #           conditioned; used for the sim deliverable).
  approach: home_aligned
  # Clearances are palm height above the block CENTER along pelvis +z. Kept below
  # the well-conditioned ceiling (palm z ~0.24 here) -- reaching higher drives the
  # wrist near-singular (offline-validated: worst 1.43x time-scale across the cycle).
  hover_offset_z: 0.12     # pregrasp hover above the block center (m).
  descend_clearance: 0.04  # palm this far above the block center at grasp (m).
  lift_height: 0.04        # added to hover for the lift target (palm z ~0.24).
  approach_axis: [0, 0, -1]  # top-down approach (pelvis frame; top_down mode).

place:
  # Block-center target in the pelvis frame (the held block lands here). For the
  # sim this is the success-region center mapped to pelvis. Orientation is unused
  # under grasp.approach: home_aligned (palm uses the home EE orientation).
  xyz: [0.236, 0.006, 0.063]
  rpy: [0.0, 0.0, 0.0]

# Sim ground-truth red-block pose in the sim WORLD frame (mirror the Isaac task's
# object default). Consumed by GroundTruthBlockSource -> pelvis via the robot
# sim.base_world_pose (configs/robot.yaml). Only used by the sim run script.
ground_truth_block_world:
  xyz: [-4.25, -4.03, 0.84]
  quat_wxyz: [1.0, 0.0, 0.0, 0.0]

arm: "right"                # which arm executes pick-place; other holds home.
retries:
  max_perception: 3
  max_grasp: 2
