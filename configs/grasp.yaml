# Grasp-source config. `grasp_source` selects where candidate grasp poses come from
# (both implement the same GraspSource interface -> ranked wrist-yaw goal Poses):
#   apriltag  -- the known-good A-B reference: detected pose + URDF palm offset (one grasp).
#   graspgenx -- learned 6-DoF grasps from the GraspGenX ZMQ service (segmented cloud in).
#   sim_cloud -- SIM only: GT cube cloud from rt/sim_state -> GraspGenX (no camera/depth/SAM3).
# 09_graspgen.py --source overrides this per run for A-B comparison.
grasp_source: graspgenx

# AprilTag source. Its palm_offset_xyz is the URDF-measured wrist_yaw->palm offset, shared
# by the GraspGenX source too (same gripper). Mirrors 07_pick_place's inline constants.
apriltag:
  palm_offset_xyz: [0.1192, -0.0346, 0.0]   # wrist_yaw -> palm grasp center (side-mirrored)
  grasp_offset:    [0.0, 0.0, 0.02]          # contact margin past the finger-base midpoint
  grasp_rpy: null                            # null = use the wrist's current FK orientation

# GraspGenX source: depth -> segmented cloud -> ZMQ infer -> ranked grasps -> wrist goals.
graspgenx:
  host: "127.0.0.1"       # GraspGenX server (runs on the workstation GPU). USER-PROVIDED.
  port: 5556
  gripper_name: "unitree_g1"
  num_grasps: 300
  topk: 200
  grasp_threshold: -1.0   # -1 = take the top-K ranked (no hard confidence threshold)
  timeout_ms: 60000
  voxel_m: 0.003          # ~3 mm voxel downsample of the cloud before infer
  # Planner / top-down selection (server-side GraspMoE). For "grab from above":
  #   topdown   -> OBB-only top-down/side grasps (no diffusion). Strong top-down preference,
  #                but NO fallback if none is reachable.
  #   graspmoe  -> diffusion UNION OBB top-down, all discriminator-scored (fallback exists,
  #                but no top-down *preference* -- picks highest score).
  #   diffusion -> diffusion only (the original beta behavior; A/B baseline).
  planner: topdown
  obb_density: dense      # dense/sparse = top-down only; dense-topandside also adds side grasps
  skip_obb_rule: auto     # never = force the OBB branch even for objects wider than the gripper
  # grasp-frame -> wrist_yaw transform. DERIVED from kinematics (NOT the AprilTag palm offset
  # reused -- that was reverse-engineered for a top-down grasp and is meaningless for GraspGenX).
  # Recipe + provenance: scripts/derive_graspgenx_tool_transform.py. RIGHT-hand reference; the
  # LEFT hand is mirrored across the wrist Y-plane in tool_transform.build_T_wristyaw_grasp.
  #
  # rotation: the fixed grasp(+Z approach, +X closing) -> wrist_yaw axis map. SIM-VALIDATED
  #   2026-06-28: approach +Z -> wrist +Y, closing +X -> wrist -X, spread +Y -> wrist +Z, i.e.
  #   rpy = [pi/2, 0, pi]. (The earlier derived [pi/2, 0, pi/2] put the palm 90deg off -- the
  #   Dex3 came down thumb-along-the-top instead of palm-down; a +90deg yaw about wrist +Z fixes
  #   it. The Dex3's real opposition is diagonal in the wrist XY-plane, so this clean-axis map
  #   is the sim-matched approximation; the translation below is exact from FK.) [r,p,y] radians.
  wristyaw_grasp_rpy: [1.5707963, 0.0, 3.1415927]
  # translation: the grasp-frame origin (GraspGenX gripper base) in the wrist_yaw frame =
  #   our power_close contact midpoint (hand FK) minus the GraspGenX fingertip depth (0.07 m)
  #   along the approach axis (now wrist +Y). So our fingers land ON the object center.
  palm_offset_xyz: [0.1142, -0.0286, 0.0]
  # Optional client-side viser GUI (point cloud + ranked grasps + gripper mesh,
  # like the GraspGenX demos). Opt-in; 09_graspgen.py --visualize flips `enabled`.
  # Renders in the pelvis frame, so grasps sit on the cloud. Server stays headless.
  visualize:
    enabled: false
    port: 8080
    show_mesh: true          # overlay the gripper collision/visual mesh at the top grasp
    threshold_tuner: false   # confidence slider; off in the gated pick flow, on in 10_graspgen_viz
    max_markers: 100         # cap markers drawn (viser slows with thousands)
    gripper_asset_dir: "assets/grippers"   # <dir>/<gripper_name>/{config.json, *_mesh.obj}

# Object segmentation (SAM3 over ZMQ) -> a 2D mask applied to the depth BEFORE deproject.
#   mode: null|none -> NullSegmenter (whole frame; sim has no SAM3).
#         auto       -> one SAM3 call with default_prompt below (headless).
#         interactive-> cv2 GUI to refine text/box/points before accepting (10_segment / 09 --segment).
segment:
  mode: null              # default off; --segment auto|interactive overrides per run
  host: "127.0.0.1"       # SAM3 server (workstation GPU). USER-PROVIDED.
  port: 5557
  timeout_ms: 60000
  top_k: 3                # >1 so points/box ambiguity candidates can be cycled in the GUI
  default_prompt:         # exactly ONE of text/box/points; used by auto, seeds interactive
    text: "red block"
    # box: [x0, y0, x1, y1]
    # points: [[x, y], ...]   # (+ optional point_labels: [1, 0, ...])

# Sim-only GraspGenX path (grasp_source: sim_cloud): build a ground-truth object cloud from the
# live rt/sim_state block pose (no camera/depth/SAM3) and feed the SAME GraspGenX + tool transform
# as `graspgenx`. Reuses the graspgenx: block (host/port/gripper/voxel/wristyaw_grasp_rpy) +
# apriltag.palm_offset_xyz. Needs `detector: sim_state` (perception.yaml) for the live block pose.
sim_cloud:
  object_size_m: 0.06       # red block edge (m); the sampled cube size
  n_points: 2000            # ~points over the cube surface (the model resamples to 3500)
  camera_facing_cull: true  # keep only faces visible to the head cam (partial-view realism)
  # Per-point COLOR (viz only; XYZ unaffected): the cube points are projected into the live sim
  # RGB (camera_sim.yaml) and sampled, like the real depth path -> viser shows the actual render
  # (red block + AprilTag). Points off-image / no frame use color_fallback.
  color_fallback: [128, 128, 128]
