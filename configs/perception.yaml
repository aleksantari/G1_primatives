# Perception config. `detector` selects the single active head-camera detector
# (factory `_DETECTORS` map): `apriltag` (live ZMQ + AprilTag) or `ground_truth`
# (constant sim block pose, no camera/marker). A model-based detector registers
# in the same map later.
detector: apriltag

# AprilTag block detection (params for the `apriltag` detector).
tag:
  family: "tag36h11"
  size_m: 0.030            # USER-PROVIDED: printed tag black-square edge length (m).
  # Per-tag rigid offset from the tag frame to the block geometric center,
  # expressed in the tag frame (x,y,z meters + rpy radians). Default: block
  # center sits half a block-height below the tag face along -z_tag.
  tag_to_block:
    xyz: [0.0, 0.0, -0.02]
    rpy: [0.0, 0.0, 0.0]
  # Map of tag id -> semantic name (optional). Unlisted ids are ignored.
  ids:
    0: "block"

filter:
  median_frames: 5         # median over N frames before a pose is accepted.
  max_stale_s: 0.5         # reject poses older than this.
  min_decision_margin: 30.0  # pupil-apriltags decision_margin gate.

# Ground-truth detector (sim, marker-free). The block's WORLD-frame pose in the
# Isaac scene; transforms.Frames maps it to the pelvis frame via robot.yaml
# `sim.base_world_pose`. TODO: set to the actual sim block pose (or swap for a
# live rt/sim_state read). Used only when `detector: ground_truth`.
ground_truth:
  block:
    xyz: [0.0, 0.0, 0.0]
    quat_wxyz: [1.0, 0.0, 0.0, 0.0]
