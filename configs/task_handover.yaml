# Arm-to-arm handover. Both wrists are solved simultaneously (one IK problem).
# Poses in the pelvis frame (meters/radians).

# Handover pose pair in front of the torso where the block is transferred.
handover_pose:
  left:
    xyz: [0.32, 0.05, 0.20]
    rpy: [1.5708, 0.0, 0.0]
  right:
    xyz: [0.32, -0.05, 0.20]
    rpy: [-1.5708, 0.0, 0.0]

approach:
  separation_pre: 0.12     # arms start this far apart along y before closing in.
  separation_post: 0.18    # arms retreat to this separation after handoff.

handshake:
  # Sequence: right pre-shaped open -> right close -> verify right grasped
  #           -> left open -> verify left released -> separate.
  # If right grasp verification FAILS, left does NOT open (no drops).
  settle_s: 0.5
  close_timeout_s: 2.0
  release_timeout_s: 1.5

giver: "left"              # arm that brings the block in; receiver = the other.
