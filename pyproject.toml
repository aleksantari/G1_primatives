[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g1_classical_manip"
version = "0.1.0"
description = "cuRobo-native action-primitive motion library for the suspended Unitree G1 (29-DoF, Dex3-1)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }

# cuRobo-native: kinematics (FK/IK/dynamics) + planning come from cuRobo (GPU),
# so pinocchio/casadi are gone and the numpy<2 / rerun pins are lifted. The repo
# runs in the `g1_curobo` conda env (py3.11, numpy2, torch-cu128, cuRobo source
# build, cyclonedds). cuRobo + a CUDA torch + cyclonedds are NOT pip-resolvable
# here — provision them per requirements-curobo.txt (see its header build note).
dependencies = [
    "numpy>=2",
    "scipy>=1.7",
    "rerun-sdk>=0.29",         # logging (roadmap; not yet wired)
    "pyyaml",
    # perception deps (dormant until perception is reworked cuRobo-native)
    "pupil-apriltags>=1.0",
    "opencv-python",
    "pyzmq",
    "msgpack",            # GraspGenX ZMQ wire protocol (thin standalone client)
    "msgpack-numpy",      # numpy arrays serialize natively over msgpack
    "tyro",
    "unitree_sdk2py @ git+https://github.com/unitreerobotics/unitree_sdk2_python.git",
]

[tool.setuptools]
packages = ["g1_classical_manip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
