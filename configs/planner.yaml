# Motion = cuRobo (robot config under configs/curobo/*.yml). cuRobo emits a
# time-parameterized, dynamically-feasible trajectory directly (position/velocity/
# acceleration at a fixed dt) -- no separate retiming step. Trajectory SPEED is
# governed by the cuRobo robot config's joint velocity/accel limits.
executor:
  control_hz: 250.0                # rate the executor streams (samples) the trajectory
  tracking_error_abort_rad: 0.20   # hold position if |q_cmd - q_meas| exceeds this
  startup_ramp_s: 3.0
  # Gravity-comp feed-forward torque (cuRobo RNEA G(q), gravity-only). ON by default
  # for REAL hardware; factory.py forces it OFF in sim (mode: sim), where the tau
  # feed-forward is neither needed nor validated. Hardware-validated 2026-06-17: sign
  # correct (elbow droop fell 50 -> 3 deg going scale 0 -> 1.0), magnitude ~15-20%
  # above pinocchio's. NOTE: gravity comp only HOLDS the arm against gravity -- the PD
  # still needs torque headroom to overcome static friction, and the velocity clip
  # caps that headroom at ~kp*arm_velocity_limit*control_dt, so keep robot.yaml
  # arm_velocity_limit >= ~12 or the shoulders stall a few deg short. Override per-run
  # via make_robot(gravity_comp=, gravity_scale=) / 04_move --gravity-scale.
  # See docs/gravity_comp.md.
  gravity_comp: true
  gravity_scale: 1.0
  # Trajectory playback time-dilation: the executor samples the cuRobo plan at
  # (wall-clock * this), so < 1.0 plays the SAME path/goal slower (lower joint
  # velocity, quadratically lower acceleration). REAL needs this because the velocity
  # clip caps PD torque (see above): at full speed (1.0) the arm can't supply the
  # torque to track a fast trajectory and the tracking error diverges -> abort
  # (hardware 2026-06-17: a 0.2 m wrist lift aborts at 1.0, tracks clean at 0.5).
  # factory.py forces this to 1.0 in sim (sim bypasses the clip, tracks full speed).
  # This is a workaround for the clip throttling torque; the root fix is to stop
  # re-rate-limiting cuRobo's already-feasible trajectory during planned execution.
  # Override per-run via 04_move --speed. Dial toward 1.0 to find the fastest that tracks.
  time_dilation: 0.5

# cuRobo solver effort (MotionPlannerCfg.create); applies to BOTH the main planner and every
# per-side grasp planner. DEFAULT = cuRobo's own (num_ik_seeds 32, num_trajopt_seeds 4) -- the
# June-30 real-hardware grasp (collision world ON) ran these. Two hard-won cautions before
# raising them:
#   * seed overrides did NOT fix the LEFT+collision-world failures (128/16 failed identically):
#     plan_grasp commits to ONE goalset winner and never retries others, so seeds only help the
#     already-chosen grasp's own solve -- the candidate-retry loop in plan_grasp_set_sweep is the
#     cross-candidate lever.
#   * the GraspGenX end2end reference (e2e_grasp_demo.py) warns that non-default seeds/tolerances
#     silently broke plan_grasp on public cuRobo ("every approach/grasp trajopt failed").
# Omit a key to use the cuRobo default (shown in []). plan_grasp has a FIXED random seed, so
# re-running is deterministic.
solver:
  # num_ik_seeds: 128                  # [32] parallel IK seeds for the goal/goalset pose
  # num_trajopt_seeds: 16              # [4]  parallel trajectory-optimization seeds
  collision_activation_distance: 0.01  # [0.01] m clearance the OPTIMIZER demands from obstacles.
                                       #   NOTE this shapes the optimizer COST only -- the hard
                                       #   pass/fail gate ('Start or End state in collision', IK
                                       #   feasibility) runs at activation 0.0 (cuRobo
                                       #   metrics_base.yml); world_check reports both tiers.
  # position_tolerance: 0.005          # [0.005] m goal position tolerance (loosen if barely unreachable)
  # orientation_tolerance: 0.05        # [0.05] rad goal orientation tolerance

# Native cuRobo plan_grasp (goalset selection + approach/grasp/lift). Feeds the K ranked grasp
# candidates as ONE goalset; cuRobo returns the feasible one (goalset_index) and plans
# approach->grasp->lift as native segments, sweeping the (approach, lift) offsets below until one
# succeeds. Used by primitives.grasp_motion / 09_graspgen (the native path; --legacy keeps the old
# sequential probe + manual offsets). See docs / the curobo_planner.plan_grasp_set* methods.
grasp:
  max_goalset: 128            # MotionPlannerCfg.create(max_goalset=…); must be >= graspgenx.topk (100).
                              # cuRobo's default is 1 -> multi-candidate goalset solves would be forbidden.
  # Axis strings are UNSIGNED ('x'|'y'|'z'); the SIGN is in the per-strategy offset.
  approach_axis: y            # DERIVED: grasp +Z (approach) -> wrist +Y (wristyaw_grasp_rpy [pi/2,0,pi]).
                              # Was 'x' under the old [pi/2,0,pi/2] transform; the 2026-06-28 re-derive
                              # maps approach to wrist +Y (closing -> -X, spread -> +Z), so the pre-grasp
                              # back-off must run along wrist Y, not X. Only matters when plan_approach
                              # is on (--grasp-only skips it, which is why the stale 'x' went unnoticed).
  approach_in_tool_frame: true   # back off along the grasp approach line (tool/wrist frame)
  lift_axis: z                # WORLD/pelvis +Z (up). NOT the tool frame -- tool +Z is the spread axis.
  lift_in_tool_frame: false
  hold_idle_arm: true         # pin the idle (non-active) arm to its start/home config in every
                              # planned segment. The single-tool-frame grasp planner leaves the idle
                              # arm unconstrained, so trajopt drifts it (and drift accumulates across
                              # approach/grasp/lift). true = hold it still (arms share no joints, so
                              # the active trajectory is untouched). See curobo_planner._hold_idle.
  disable_collision_links: null  # null -> [active wrist link] (config has grasp_contact_link_names: null)
  # approach_offset NEGATIVE (back off -wrist-Y, away from the object); lift_offset POSITIVE (world +Z up).
  # GEOMETRIC variations only (long -> short approach). Degradation fallbacks (skip lift /
  # skip approach) were REMOVED from the default sweep (2026-07-08): silently dropping the
  # approach phase abandons the approach-vs-object collision guarantee, and an autonomous
  # caller would see ok=true without knowing. They remain available as EXPLICIT choices:
  # GraspOptions(approach=False / lift=False) compiles them per call, or
  # robot.set_grasp_strategies([...]) for a custom sweep.
  strategies:
    - {approach_offset: -0.15, lift_offset: 0.20}
    - {approach_offset: -0.10, lift_offset: 0.15}
    - {approach_offset: -0.07, lift_offset: 0.10}
  # Depth-ESDF collision world: head depth -> cuRobo Mapper -> ESDF VoxelGrid -> the grasp planner,
  # so the APPROACH routes around the object/table instead of barging through it. SAME path sim
  # (Isaac front_camera depth) + real (ZED); source-independent (uses head depth, any grasp source).
  # The grasp planner is built voxel-capable and the active hand links are collision-disabled during
  # the grasp (so the open hand may sit in the object ESDF). See motion/collision_world.py.
  # OFF by default -- opt in here or with `09_graspgen.py --collision-world`. Needs a head depth
  # stream (08_check_depth --target <t> green). extent_m is a multiple of esdf_voxel_size.
  collision_world:
    enabled: false
    grid_center: [0.4, 0.0, 0.2]   # pelvis-frame centre of the workspace box (m)
    extent_m:    [1.2, 1.2, 1.0]   # workspace box size (m); ESDF is built over this
    esdf_voxel_size: 0.01          # ESDF resolution (m) -- collision query grid. 1cm: a ~5cm block
                                   # is ~5 voxels (vs ~2-3 at 2cm), so the self-filter's top-shave
                                   # leaves a solid obstacle the approach keeps clearance from.
    tsdf_voxel_size: 0.005         # TSDF fusion resolution (m), finer than the ESDF
    depth_min_m: 0.1               # ignore depth nearer than this (m)
    depth_max_m: 2.0               # ignore depth past this (m) -- crop to the workspace
    # Robot self-filter (cuRobo RobotSegmenter): zero the depth pixels within robot_mask_margin of
    # the robot's collision spheres at the current q, so the head camera does NOT fuse the arm/hands
    # into the world (without this the grasp starts inside a baked-in copy of the arm -> infeasible).
    # Keep ON. Bigger margin removes more of the robot but risks erasing object points near the hand.
    self_filter: true
    # m around each collision sphere to treat as robot. TRADEOFF (the hand is near the object at
    # home): too big erodes a nearby object out of the world, too small leaves arm fragments. 0.05
    # (cuRobo default) eroded the block to ~1 voxel -> the approach plowed through it; 0.02 keeps
    # the block solid while the tall arm is removed (validate with 12_check_world --probe/--margin).
    robot_mask_margin: 0.02
    # Cut the TARGET object out of the world (its SAM3 mask zeroed in the depth pre-fusion).
    # DEFAULT OFF (2026-07-03): with the object IN the world, native plan_grasp already gives the
    # per-phase semantics we want -- the Step-2 APPROACH plans with ALL links enabled (hand + arm
    # collision-checked against the target, so the motion to the pre-grasp can't sweep through it),
    # while Steps 1/3/4 (goalset pick, grasp descent, lift) disable the hand links so intended
    # contact is allowed. Cutting the object made the approach BLIND to it. The old default-ON
    # rationale ("an in-world target blocks its own pre-grasp") predates the cuRobo voxel-dims fix
    # (phantom hits) and is contradicted by the sim_cloud runs (no mask -> object always in-world;
    # planned fine post-fix). Flip ON only as a clutter escape hatch if diagnostics show every
    # reachable pre-grasp genuinely INSIDE the (inflated) target ESDF -- try the larger
    # approach_offset strategies and a finer esdf_voxel_size first. Only the graspgenx source
    # carries a mask (sim_cloud -> automatic no-op either way).
    exclude_object: false
    exclude_object_dilate_px: 4    # grow the mask this many px pre-cut (mask-edge depth bleed)
